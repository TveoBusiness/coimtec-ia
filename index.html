<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b192c">

<title>COIMTEC IA - TVEO Business</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    width:100%;
    height:100vh;
    background:#f4f7f6;
    display:flex;
    justify-content:center;
    align-items:center;
}

.chat-container{
    width:100%;
    max-width:480px;
    height:90vh;
    background:white;
    border-radius:14px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* HEADER */
.chat-header{
    background:#0b192c;
    color:white;
    padding:16px 20px;
    display:flex;
    align-items:center;
    gap:14px;
}

.chat-header img{
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
    background:white;
}

.chat-header h2{
    font-size:18px;
}

.chat-header span{
    display:block;
    margin-top:4px;
    color:#25d366;
    font-size:13px;
}

/* MENSAJES */
.chat-messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    background:#fafafa;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.message{
    max-width:85%;
    padding:13px 16px;
    border-radius:12px;
    font-size:15px;
    line-height:1.5;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.message.user{
    align-self:flex-end;
    background:#0b192c;
    color:white;
    border-bottom-right-radius:3px;
}

.message.assistant{
    align-self:flex-start;
    background:#e7e9ec;
    color:#222;
    border-bottom-left-radius:3px;
}

/* BOTON WHATSAPP */
.whatsapp-area{
    padding:10px 15px 5px 15px;
    background:#fafafa;
}

.whatsapp-button{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    width:100%;

    padding:15px;

    background:#25d366;
    color:white;

    text-decoration:none;

    border-radius:10px;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    border:0;

    box-shadow:0 3px 8px rgba(37,211,102,.25);

    transition:.2s;
}

.whatsapp-button:hover{
    background:#1ebe5d;
    transform:translateY(-1px);
}

.whatsapp-button:active{
    transform:scale(.98);
}

.whatsapp-icon{
    font-size:22px;
}

/* INPUT */
.chat-input-area{
    display:flex;
    gap:10px;
    padding:14px;
    background:white;
    border-top:1px solid #ddd;
}

.chat-input-area input{
    flex:1;
    min-width:0;

    padding:12px 14px;

    border:1px solid #ddd;
    border-radius:8px;

    outline:none;

    font-size:15px;
}

.chat-input-area input:focus{
    border-color:#25d366;
}

.chat-input-area button{
    padding:0 18px;

    border:none;
    border-radius:8px;

    background:#25d366;
    color:white;

    font-weight:bold;

    cursor:pointer;
}

.chat-input-area button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* LOADING */
.loading{
    display:flex;
    gap:5px;
}

.loading span{
    width:7px;
    height:7px;

    background:#777;

    border-radius:50%;

    animation:loading 1.2s infinite;
}

.loading span:nth-child(2){
    animation-delay:.15s;
}

.loading span:nth-child(3){
    animation-delay:.30s;
}

@keyframes loading{

    0%,60%,100%{
        transform:translateY(0);
        opacity:.4;
    }

    30%{
        transform:translateY(-5px);
        opacity:1;
    }
}

/* CELULAR */
@media (max-width:600px){

    body{
        height:100dvh;
        background:white;
    }

    .chat-container{
        width:100%;
        height:100dvh;
        max-width:none;
        border-radius:0;
        box-shadow:none;
    }

    .chat-messages{
        padding:15px;
    }

    .message{
        max-width:90%;
    }

}
</style>
</head>


<body>

<div class="chat-container">

    <!-- HEADER -->
    <div class="chat-header">

        <img
            src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA="
            alt="COIMTEC IA"
        >

        <div>
            <h2>COIMTEC IA</h2>
            <span>● En línea</span>
        </div>

    </div>


    <!-- MENSAJES -->
    <div id="chatMessages" class="chat-messages">

        <div class="message assistant">

¡Hola! Soy COIMTEC IA de TVEO Business.

¿En qué proyecto inmobiliario te gustaría que te ayude hoy?

        </div>

    </div>


    <!-- WHATSAPP FIJO -->
    <div class="whatsapp-area">

    <a
        href="https://wa.me/message/PJBMLOLZEDVPF1"
        style="
            display:block;
            width:100%;
            padding:18px;
            background:#25D366;
            color:#ffffff;
            text-align:center;
            text-decoration:none;
            border-radius:12px;
            font-family:Arial,sans-serif;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
        "
    >
        💬 HABLAR CON UN ASESOR
    </a>

</div>


    <!-- INPUT -->
    <div class="chat-input-area">

        <input
            id="userInput"
            type="text"
            placeholder="Escribe tu consulta aquí..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            type="button"
        >
            Enviar
        </button>

    </div>

</div>


<script>

const API_URL = "/api/chat";

const chatMessages =
    document.getElementById("chatMessages");

const userInput =
    document.getElementById("userInput");

const sendButton =
    document.getElementById("sendButton");


let chatHistory = [];


/* SCROLL */

function scrollChat(){

    setTimeout(function(){

        chatMessages.scrollTop =
            chatMessages.scrollHeight;

    },50);

}


/* MENSAJE USUARIO */

function appendUserMessage(text){

    const div =
        document.createElement("div");

    div.className =
        "message user";

    div.textContent =
        text;

    chatMessages.appendChild(div);

    scrollChat();

}


/* LIMPIAR WHATSAPP DE LA RESPUESTA */

function limpiarRespuesta(text){

    if(!text){
        return "";
    }

    return text

        .replace(
            /https?:\/\/(?:www\.)?wa\.me\/[^\s<>"')\]]+/gi,
            ""
        )

        .replace(
            /https?:\/\/chat\.whatsapp\.com\/[^\s<>"')\]]+/gi,
            ""
        )

        .replace(/👉/g,"")

        .replace(
            /\n\s*\n\s*\n/g,
            "\n\n"
        )

        .trim();

}


/* MENSAJE IA */

function appendAssistantMessage(text){

    const div =
        document.createElement("div");

    div.className =
        "message assistant";


    const cleanText =
        limpiarRespuesta(text);


    if(cleanText){

        const textElement =
            document.createElement("div");

        textElement.textContent =
            cleanText;

        div.appendChild(textElement);

    }


    chatMessages.appendChild(div);

    scrollChat();

}


/* LOADING */

function showLoading(){

    const div =
        document.createElement("div");

    div.className =
        "message assistant";

    div.id =
        "loadingMessage";

    div.innerHTML = `
        <div class="loading">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;

    chatMessages.appendChild(div);

    scrollChat();

}


/* OCULTAR LOADING */

function hideLoading(){

    const loading =
        document.getElementById(
            "loadingMessage"
        );

    if(loading){

        loading.remove();

    }

}


/* ENVIAR MENSAJE */

async function sendMessage(){

    const text =
        userInput.value.trim();


    if(!text){
        return;
    }


    sendButton.disabled = true;

    userInput.disabled = true;


    appendUserMessage(text);


    userInput.value = "";


    showLoading();


    try{

        chatHistory.push({

            role:"user",

            content:text

        });


        if(chatHistory.length > 20){

            chatHistory =
                chatHistory.slice(-20);

        }


        const response =
            await fetch(

                API_URL,

                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        message:text,

                        history:chatHistory

                    })

                }

            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        hideLoading();


        const answer =
            data.answer ||
            "No pude generar una respuesta.";


        chatHistory.push({

            role:"assistant",

            content:answer

        });


        if(chatHistory.length > 20){

            chatHistory =
                chatHistory.slice(-20);

        }


        appendAssistantMessage(answer);


    }catch(error){

        console.error(
            "COIMTEC IA:",
            error
        );


        hideLoading();


        appendAssistantMessage(
            "No pude conectarme con COIMTEC IA. Por favor, intenta nuevamente."
        );

    }


    sendButton.disabled = false;

    userInput.disabled = false;

    userInput.focus();

}


/* BOTON ENVIAR */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* ENTER */

userInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* INICIO */

userInput.focus();


/*
==================================================
WHATSAPP
==================================================

El botón utiliza directamente:

https://wa.me/message/PJBMLOLZEDVPF1

No depende de Gemini.
No depende de /api/chat.
No depende de JavaScript.

==================================================
*/

</script>

</body>
</html>
