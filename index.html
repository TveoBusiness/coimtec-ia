<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b192c">

<title>COIMTEC IA</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef3f8;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CONTENEDOR PRINCIPAL */
.app {
    width: 100%;
    max-width: 520px;
    height: 100vh;
    max-height: 900px;
    background: white;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(0,0,0,0.15);
}

/* CABECERA */
.header {
    background: linear-gradient(135deg, #071526, #0b2a4a);
    color: white;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 13px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    z-index: 5;
}

.logo {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    object-fit: cover;
    background: white;
    padding: 2px;
}

.header-info {
    flex: 1;
}

.header-title {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .3px;
}

.header-subtitle {
    margin-top: 4px;
    font-size: 12px;
    opacity: .82;
}

/* ESTADO */
.status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #b8ffd1;
    margin-top: 5px;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #28d76f;
    box-shadow: 0 0 7px rgba(40,215,111,.8);
}

/* CHAT */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px 15px;
    background:
        linear-gradient(
            rgba(245,248,252,.95),
            rgba(245,248,252,.95)
        );
    scroll-behavior: smooth;
}

/* MENSAJES */
.message {
    max-width: 88%;
    margin-bottom: 14px;
    padding: 12px 14px;
    border-radius: 15px;
    line-height: 1.5;
    font-size: 14px;
    word-wrap: break-word;
    overflow-wrap: anywhere;
}

.message.user {
    margin-left: auto;
    background: #0b3d91;
    color: white;
    border-bottom-right-radius: 4px;
    box-shadow: 0 3px 8px rgba(11,61,145,.2);
}

.message.ai {
    margin-right: auto;
    background: white;
    color: #17212b;
    border: 1px solid #e1e7ee;
    border-bottom-left-radius: 4px;
    box-shadow: 0 3px 10px rgba(0,0,0,.06);
}

.ai-text {
    white-space: pre-wrap;
}

/* BOTÓN WHATSAPP */
.whatsapp-button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;

    width: 100%;
    max-width: 340px;

    margin-top: 14px;
    padding: 14px 18px;

    background: #25D366;
    color: white !important;

    text-decoration: none !important;

    border-radius: 12px;

    font-size: 14px;
    font-weight: 800;
    letter-spacing: .2px;

    cursor: pointer;

    box-shadow: 0 5px 14px rgba(37,211,102,.28);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

.whatsapp-button:hover {
    background: #20bd5b;
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(37,211,102,.35);
}

.whatsapp-button:active {
    transform: scale(.98);
}

.whatsapp-icon {
    font-size: 21px;
    line-height: 1;
}

/* LOADING */
.loading {
    display: flex;
    align-items: center;
    gap: 5px;
}

.loading span {
    width: 7px;
    height: 7px;
    background: #7b8794;
    border-radius: 50%;
    animation: loading 1.2s infinite ease-in-out;
}

.loading span:nth-child(2) {
    animation-delay: .15s;
}

.loading span:nth-child(3) {
    animation-delay: .30s;
}

@keyframes loading {
    0%, 60%, 100% {
        transform: translateY(0);
        opacity: .45;
    }

    30% {
        transform: translateY(-5px);
        opacity: 1;
    }
}

/* ZONA DE ESCRITURA */
.input-area {
    display: flex;
    gap: 9px;
    padding: 12px;
    background: white;
    border-top: 1px solid #e4e9ef;
}

.input {
    flex: 1;
    min-width: 0;

    border: 1px solid #d5dde7;
    border-radius: 12px;

    padding: 12px 14px;

    font-size: 14px;
    outline: none;

    background: #f8fafc;

    transition:
        border .2s ease,
        box-shadow .2s ease;
}

.input:focus {
    border-color: #0b3d91;
    box-shadow: 0 0 0 3px rgba(11,61,145,.08);
    background: white;
}

.send-button {
    border: none;
    border-radius: 12px;

    min-width: 52px;

    background: #0b3d91;
    color: white;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;

    transition:
        background .2s ease,
        transform .2s ease;
}

.send-button:hover {
    background: #092f70;
}

.send-button:active {
    transform: scale(.95);
}

.send-button:disabled {
    opacity: .55;
    cursor: not-allowed;
}

/* MENSAJE INICIAL */
.welcome {
    text-align: center;
    color: #687586;
    padding: 25px 15px;
    font-size: 13px;
}

.welcome strong {
    display: block;
    color: #0b3d91;
    font-size: 17px;
    margin-bottom: 7px;
}

/* SCROLLBAR */
.chat::-webkit-scrollbar {
    width: 5px;
}

.chat::-webkit-scrollbar-thumb {
    background: #c6ced8;
    border-radius: 10px;
}

/* MÓVIL */
@media (max-width: 600px) {

    body {
        align-items: stretch;
    }

    .app {
        max-width: none;
        max-height: none;
        height: 100vh;
        border-radius: 0;
    }

    .header {
        padding: 13px 14px;
    }

    .logo {
        width: 47px;
        height: 47px;
    }

    .header-title {
        font-size: 18px;
    }

    .chat {
        padding: 15px 11px;
    }

    .message {
        max-width: 92%;
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- CABECERA -->
    <div class="header">

        <!--
        IMPORTANTE:
        Puedes reemplazar esta imagen por tu logo real de COIMTEC.
        -->
        <img
            class="logo"
            src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA..."
            alt="COIMTEC"
        >

        <div class="header-info">

            <h1 class="header-title">
                COIMTEC IA
            </h1>

            <div class="header-subtitle">
                Asistente virtual de TVEO Business
            </div>

            <div class="status">
                <span class="status-dot"></span>
                En línea
            </div>

        </div>

    </div>


    <!-- CHAT -->
    <div id="chat" class="chat">

        <div class="welcome">
            <strong>¡Hola! 👋</strong>

            Soy COIMTEC IA, tu asistente virtual.

            <br><br>

            Puedo ayudarte con información sobre nuestros
            proyectos inmobiliarios, precios, modalidades de
            financiamiento y visitas.

        </div>

    </div>


    <!-- INPUT -->
    <div class="input-area">

        <input
            id="messageInput"
            class="input"
            type="text"
            placeholder="Escribe tu consulta..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            class="send-button"
            type="button"
            aria-label="Enviar"
        >
            ➤
        </button>

    </div>

</div>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const API_URL = "/api/chat";

const WHATSAPP_URL =
    "https://wa.me/message/PJBMLOLZEDVPF1";


/* =========================================================
   ELEMENTOS
========================================================= */

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");


/* =========================================================
   HISTORIAL
========================================================= */

let chatHistory = [];


/* =========================================================
   SCROLL
========================================================= */

function scrollChat() {

    setTimeout(() => {

        chat.scrollTop = chat.scrollHeight;

    }, 50);
}


/* =========================================================
   MENSAJE DE USUARIO
========================================================= */

function agregarMensajeUsuario(texto) {

    const mensaje = document.createElement("div");

    mensaje.className = "message user";

    mensaje.textContent = texto;

    chat.appendChild(mensaje);

    scrollChat();
}


/* =========================================================
   BOTÓN WHATSAPP
========================================================= */

function crearBotonWhatsApp(contenedor) {

    const boton = document.createElement("a");

    boton.href = WHATSAPP_URL;

    boton.target = "_blank";

    boton.rel = "noopener noreferrer";

    boton.className = "whatsapp-button";

    boton.innerHTML = `
        <span class="whatsapp-icon">💬</span>
        <span>HABLAR CON UN ASESOR</span>
    `;

    contenedor.appendChild(boton);
}


/* =========================================================
   PROCESAR RESPUESTA DE LA IA
========================================================= */

function agregarMensajeIA(texto, mostrarWhatsApp = false) {

    const mensaje = document.createElement("div");

    mensaje.className = "message ai";


    /*
    Detectamos cualquier URL de WhatsApp
    que Gemini pueda devolver.
    */

    const regexWhatsApp =
        /https?:\/\/(?:www\.)?wa\.me\/[^\s<>"')\]]+/gi;


    const encontrado =
        texto.match(regexWhatsApp);


    /*
    También detectamos Markdown:

    [Hablar con asesor](https://wa.me/...)
    */

    const tieneMarkdownWhatsApp =
        /\[[^\]]*\]\(\s*https?:\/\/(?:www\.)?wa\.me\/[^)]+\)/i
        .test(texto);


    /*
    Si el Worker indica whatsapp=true,
    también mostramos el botón.
    */

    const debeMostrarBoton =
        mostrarWhatsApp ||
        encontrado ||
        tieneMarkdownWhatsApp;


    /*
    Eliminamos los enlaces del texto.
    */

    let textoLimpio = texto;


    // Eliminar enlaces Markdown de WhatsApp
    textoLimpio = textoLimpio.replace(
        /\[[^\]]*\]\(\s*https?:\/\/(?:www\.)?wa\.me\/[^)]+\)/gi,
        ""
    );


    // Eliminar URL directa de WhatsApp
    textoLimpio = textoLimpio.replace(
        /https?:\/\/(?:www\.)?wa\.me\/[^\s<>"')\]]+/gi,
        ""
    );


    /*
    Limpiamos espacios y líneas sobrantes.
    */

    textoLimpio = textoLimpio
        .replace(/\n\s*\n\s*\n/g, "\n\n")
        .trim();


    /*
    Mostrar texto de la IA.
    */

    if (textoLimpio) {

        const textoElemento =
            document.createElement("div");

        textoElemento.className = "ai-text";

        textoElemento.textContent = textoLimpio;

        mensaje.appendChild(textoElemento);
    }


    /*
    BOTÓN WHATSAPP
    */

    if (debeMostrarBoton) {

        crearBotonWhatsApp(mensaje);

    }


    chat.appendChild(mensaje);

    scrollChat();
}


/* =========================================================
   LOADING
========================================================= */

function mostrarLoading() {

    const mensaje = document.createElement("div");

    mensaje.className = "message ai";

    mensaje.id = "loadingMessage";

    mensaje.innerHTML = `
        <div class="loading">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;

    chat.appendChild(mensaje);

    scrollChat();
}


function quitarLoading() {

    const loading =
        document.getElementById("loadingMessage");

    if (loading) {

        loading.remove();

    }
}


/* =========================================================
   ENVIAR MENSAJE
========================================================= */

async function enviarMensaje() {

    const texto =
        input.value.trim();


    if (!texto) {

        return;

    }


    /*
    Evitar doble envío.
    */

    sendButton.disabled = true;

    input.disabled = true;


    /*
    Mostrar mensaje del cliente.
    */

    agregarMensajeUsuario(texto);


    /*
    Limpiar input.
    */

    input.value = "";


    /*
    Loading.
    */

    mostrarLoading();


    try {

        /*
        Guardar mensaje en historial.
        */

        chatHistory.push({

            role: "user",

            parts: [
                {
                    text: texto
                }
            ]

        });


        /*
        Limitar historial para no enviar
        demasiada información.
        */

        if (chatHistory.length > 20) {

            chatHistory =
                chatHistory.slice(-20);

        }


        /*
        Enviar al Worker.
        */

        const respuesta =
            await fetch(API_URL, {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    message: texto,

                    history: chatHistory

                })

            });


        /*
        Verificar respuesta HTTP.
        */

        if (!respuesta.ok) {

            throw new Error(
                "Error HTTP " +
                respuesta.status
            );

        }


        const data =
            await respuesta.json();


        /*
        Quitar loading.
        */

        quitarLoading();


        /*
        Respuesta de Gemini.
        */

        const respuestaIA =
            data.answer ||
            data.response ||
            data.text ||
            "No pude obtener una respuesta.";


        /*
        Guardar respuesta en historial.
        */

        chatHistory.push({

            role: "model",

            parts: [
                {
                    text: respuestaIA
                }
            ]

        });


        /*
        IMPORTANTE:

        data.whatsapp viene desde el Worker.

        Si es true, mostramos el botón
        independientemente de que Gemini
        haya escrito o no el enlace.
        */

        const mostrarWhatsApp =
            data.whatsapp === true;


        /*
        Mostrar respuesta.
        */

        agregarMensajeIA(
            respuestaIA,
            mostrarWhatsApp
        );


    } catch (error) {

        console.error(error);


        quitarLoading();


        agregarMensajeIA(
            "Lo siento, ocurrió un problema al procesar tu consulta. Por favor, intenta nuevamente."
        );

    }


    /*
    Reactivar controles.
    */

    sendButton.disabled = false;

    input.disabled = false;

    input.focus();

}


/* =========================================================
   BOTÓN ENVIAR
========================================================= */

sendButton.addEventListener(
    "click",
    enviarMensaje
);


/* =========================================================
   ENTER PARA ENVIAR
========================================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            enviarMensaje();

        }

    }
);


/* =========================================================
   INICIO
========================================================= */

input.focus();

</script>

</body>
</html>
