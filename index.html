<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b192c">
    <title>COIMTEC IA - Asistente Comercial</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 90vh;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,.10);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #0b192c;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-header img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #25d366;
            background: #fff;
        }

        .chat-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .chat-header span {
            display: block;
            margin-top: 3px;
            font-size: .8rem;
            color: #25d366;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fcfcfc;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: .95rem;
            line-height: 1.5;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .message.user {
            background: #0b192c;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.assistant {
            background: #e4e6eb;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        /* =====================================================
           BOTÓN WHATSAPP
        ===================================================== */

        .whatsapp-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-top: 14px;
            padding: 14px 18px;
            background: #25d366;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: .92rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37,211,102,.28);
            transition: .2s ease;
            appearance: none;
            -webkit-appearance: none;
        }

        .whatsapp-button:hover {
            background: #1ebe5d;
            transform: translateY(-1px);
        }

        .whatsapp-button:active {
            transform: scale(.98);
        }

        .whatsapp-icon {
            font-size: 1.3rem;
        }

        /* =====================================================
           INPUT
        ===================================================== */

        .chat-input-area {
            padding: 15px;
            background: #fff;
            border-top: 1px solid #eaeaea;
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            min-width: 0;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: .95rem;
        }

        .chat-input-area input:focus {
            border-color: #25d366;
        }

        .chat-input-area button {
            background: #25d366;
            color: #fff;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-input-area button:hover {
            background: #1ebe5d;
        }

        .chat-input-area button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* =====================================================
           LOADING
        ===================================================== */

        .loading {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .loading span {
            width: 7px;
            height: 7px;
            background: #777;
            border-radius: 50%;
            animation: loading 1.2s infinite ease-in-out;
        }

        .loading span:nth-child(2) {
            animation-delay: .15s;
        }

        .loading span:nth-child(3) {
            animation-delay: .30s;
        }

        @keyframes loading {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: .4;
            }

            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        /* =====================================================
           MÓVIL
        ===================================================== */

        @media (max-width: 600px) {

            body {
                height: 100dvh;
                background: #fff;
                align-items: stretch;
            }

            .chat-container {
                width: 100%;
                max-width: 100%;
                height: 100dvh;
                border-radius: 0;
                box-shadow: none;
            }

            .chat-messages {
                padding: 15px;
            }

            .message {
                max-width: 90%;
            }

            .chat-input-area {
                padding: 10px;
            }

            .chat-input-area button {
                padding: 0 16px;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <!-- ENCABEZADO -->

    <div class="chat-header">

        <img
            src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA="
            alt="CoimTec IA"
        >

        <div>
            <h2>COIMTEC IA</h2>
            <span>● En línea</span>
        </div>

    </div>


    <!-- MENSAJES -->

    <div
        class="chat-messages"
        id="chatMessages"
    >

        <div class="message assistant">

            ¡Hola! Soy COIMTEC IA de TVEO Business.

            ¿En qué proyecto inmobiliario te gustaría que te ayude hoy?

        </div>

    </div>


    <!-- INPUT -->

    <div class="chat-input-area">

        <input
            id="userInput"
            type="text"
            placeholder="Escribe tu consulta aquí..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            type="button"
        >
            Enviar
        </button>

    </div>

</div>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const API_URL = "/api/chat";

const WHATSAPP_URL =
    "https://wa.me/message/PJBMLOLZEDVPF1";


/* =========================================================
   ELEMENTOS
========================================================= */

const chatMessages =
    document.getElementById("chatMessages");

const userInput =
    document.getElementById("userInput");

const sendButton =
    document.getElementById("sendButton");


/* =========================================================
   HISTORIAL
========================================================= */

let chatHistory = [];


/* =========================================================
   SCROLL
========================================================= */

function scrollChat() {

    setTimeout(() => {

        chatMessages.scrollTop =
            chatMessages.scrollHeight;

    }, 50);

}


/* =========================================================
   MENSAJE USUARIO
========================================================= */

function appendUserMessage(text) {

    const div =
        document.createElement("div");

    div.className =
        "message user";

    div.textContent =
        text;

    chatMessages.appendChild(div);

    scrollChat();

}


/* =========================================================
   BOTÓN WHATSAPP
========================================================= */

function createWhatsAppButton() {

    const button =
        document.createElement("button");

    button.type =
        "button";

    button.className =
        "whatsapp-button";

    button.innerHTML = `
        <span class="whatsapp-icon">💬</span>
        <span>HABLAR CON UN ASESOR</span>
    `;


    button.addEventListener(
        "click",
        function () {

            window.location.href =
                WHATSAPP_URL;

        }
    );


    return button;

}


/* =========================================================
   LIMPIAR URL DE WHATSAPP DEL TEXTO
========================================================= */

function cleanWhatsAppLinks(text) {

    if (!text) {
        return "";
    }


    let limpio =
        text.replace(
            /https?:\/\/(?:www\.)?wa\.me\/message\/[^\s<>"')\]]+/gi,
            ""
        );


    limpio =
        limpio.replace(
            /\[[^\]]*\]\(\s*https?:\/\/(?:www\.)?wa\.me\/[^)]+\)/gi,
            ""
        );


    limpio =
        limpio.replace(
            /👉/g,
            ""
        );


    return limpio
        .replace(/\n\s*\n\s*\n/g, "\n\n")
        .trim();

}


/* =========================================================
   DETECTAR SOLICITUD DE ASESOR
========================================================= */

function necesitaAsesor(text) {

    if (!text) {
        return false;
    }


    const texto =
        text
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");


    const frases = [

        "asesor",
        "asesora",

        "vendedor",
        "vendedora",

        "ventas",

        "whatsapp",

        "direccioname",

        "derivame",

        "contactar",

        "comunicarme",

        "hablar con alguien",

        "hablar con ventas",

        "hablar con un asesor",

        "hablar con una asesora",

        "quiero un asesor",

        "quiero una asesora",

        "quiero hablar con un asesor",

        "quiero hablar con una asesora",

        "necesito un asesor",

        "necesito una asesora",

        "pasame con un asesor",

        "pasame con una asesora",

        "contacto con un asesor",

        "contacto con una asesora",

        "numero del asesor",

        "numero de la asesora",

        "asesor por whatsapp",

        "asesora por whatsapp"

    ];


    return frases.some(
        frase =>
            texto.includes(frase)
    );

}


/* =========================================================
   RESPUESTA DEL ASISTENTE
========================================================= */

function appendAssistantMessage(
    text,
    showWhatsApp
) {

    const div =
        document.createElement("div");

    div.className =
        "message assistant";


    const cleanText =
        cleanWhatsAppLinks(text);


    if (cleanText) {

        const textElement =
            document.createElement("div");

        textElement.textContent =
            cleanText;

        div.appendChild(
            textElement
        );

    }


    if (showWhatsApp === true) {

        div.appendChild(
            createWhatsAppButton()
        );

    }


    chatMessages.appendChild(div);

    scrollChat();

}


/* =========================================================
   LOADING
========================================================= */

function showLoading() {

    const div =
        document.createElement("div");

    div.className =
        "message assistant";

    div.id =
        "loadingMessage";

    div.innerHTML = `
        <div class="loading">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;

    chatMessages.appendChild(div);

    scrollChat();

}


/* =========================================================
   OCULTAR LOADING
========================================================= */

function hideLoading() {

    const loading =
        document.getElementById(
            "loadingMessage"
        );

    if (loading) {
        loading.remove();
    }

}


/* =========================================================
   ENVIAR MENSAJE
========================================================= */

async function sendMessage() {

    const text =
        userInput.value.trim();


    if (!text) {
        return;
    }


    sendButton.disabled =
        true;

    userInput.disabled =
        true;


    appendUserMessage(text);

    userInput.value = "";

    showLoading();


    try {

        /* ==============================================
           HISTORIAL USUARIO
        ============================================== */

        chatHistory.push({

            role: "user",

            content: text

        });


        if (chatHistory.length > 20) {

            chatHistory =
                chatHistory.slice(-20);

        }


        /* ==============================================
           API
        ============================================== */

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message: text,

                            history:
                                chatHistory

                        })
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        hideLoading();


        /* ==============================================
           RESPUESTA
        ============================================== */

        const answer =
            data.answer ||
            "No pude obtener una respuesta.";


        /* ==============================================
           HISTORIAL ASISTENTE
        ============================================== */

        chatHistory.push({

            role: "assistant",

            content: answer

        });


        if (chatHistory.length > 20) {

            chatHistory =
                chatHistory.slice(-20);

        }


        /* ==============================================
           BOTÓN WHATSAPP

           Se activa directamente por el mensaje
           del cliente.
        ============================================== */

        const showWhatsApp =
            necesitaAsesor(text);


        /* ==============================================
           MOSTRAR RESPUESTA
        ============================================== */

        appendAssistantMessage(
            answer,
            showWhatsApp
        );


    } catch (error) {

        console.error(
            "COIMTEC IA:",
            error
        );


        hideLoading();


        appendAssistantMessage(

            "Error de conexión con COIMTEC IA. " +
            "Por favor, intenta nuevamente.",

            false

        );

    }


    sendButton.disabled =
        false;

    userInput.disabled =
        false;

    userInput.focus();

}


/* =========================================================
   CLICK ENVIAR
========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER
========================================================= */

userInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   FOCUS
========================================================= */

userInput.focus();

</script>

</body>
</html>
