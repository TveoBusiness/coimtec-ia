```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>COIMTEC IA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 900px;
      height: 95vh;
      background: #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
    }

    /* ENCABEZADO */

    .header {
      background: #111827;
      color: white;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #ffffff;
      color: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 15px;
    }

    .header-info h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }

    .header-info p {
      font-size: 13px;
      color: #cbd5e1;
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #86efac;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      background: #22c55e;
      border-radius: 50%;
    }

    /* CHAT */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
      background: #f8fafc;
    }

    .message {
      display: flex;
      margin-bottom: 18px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;
      padding: 13px 16px;
      border-radius: 15px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.bot .bubble {
      background: #ffffff;
      color: #1f2937;
      border: 1px solid #e5e7eb;
      border-top-left-radius: 5px;
    }

    .message.user .bubble {
      background: #111827;
      color: white;
      border-top-right-radius: 5px;
    }

    /* ESCRIBIENDO */

    .typing {
      display: none;
      margin-bottom: 15px;
    }

    .typing .bubble {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: #9ca3af;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 80%, 100% {
        opacity: 0.3;
      }

      40% {
        opacity: 1;
      }
    }

    /* AREA DE ESCRITURA */

    .input-area {
      padding: 15px;
      background: #ffffff;
      border-top: 1px solid #e5e7eb;
    }

    .input-box {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 130px;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 13px;
      outline: none;
      font-family: inherit;
      font-size: 14px;
    }

    textarea:focus {
      border-color: #111827;
    }

    button {
      width: 50px;
      height: 48px;
      border: none;
      border-radius: 13px;
      background: #111827;
      color: white;
      cursor: pointer;
      font-size: 18px;
      transition: 0.2s;
    }

    button:hover {
      background: #374151;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .footer {
      text-align: center;
      margin-top: 8px;
      font-size: 11px;
      color: #9ca3af;
    }

    /* CELULAR */

    @media (max-width: 600px) {
      body {
        align-items: stretch;
      }

      .app {
        height: 100vh;
        border-radius: 0;
      }

      .chat {
        padding: 15px;
      }

      .bubble {
        max-width: 85%;
      }

      .header {
        padding: 15px;
      }

      .status {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- ENCABEZADO -->
    <header class="header">

      <div class="logo">
        CI
      </div>

      <div class="header-info">
        <h1>COIMTEC IA</h1>
        <p>Asistente Inteligente · TVEO Business</p>
      </div>

      <div class="status">
        <div class="status-dot"></div>
        En línea
      </div>

    </header>


    <!-- CHAT -->
    <main class="chat" id="chat">

      <div class="message bot">
        <div class="bubble">
          Hola, soy COIMTEC IA. 👋

          Estoy listo para ayudarte con información comercial, clientes, proyectos inmobiliarios y gestión de ventas.

          ¿En qué podemos trabajar?
        </div>
      </div>

    </main>


    <!-- INDICADOR ESCRIBIENDO -->
    <div class="typing" id="typing">

      <div class="bubble">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>


    <!-- AREA DE MENSAJE -->
    <section class="input-area">

      <div class="input-box">

        <textarea
          id="messageInput"
          placeholder="Escribe tu mensaje..."
          rows="1"
        ></textarea>

        <button
          id="sendButton"
          onclick="sendMessage()"
          title="Enviar"
        >
          ➤
        </button>

      </div>

      <div class="footer">
        COIMTEC IA · TVEO Business
      </div>

    </section>

  </div>


  <script>

    let conversationHistory = [];


    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const chat = document.getElementById("chat");
    const typing = document.getElementById("typing");


    /*
      AGREGAR MENSAJE AL CHAT
    */

    function addMessage(text, type) {

      const message = document.createElement("div");

      message.className = "message " + type;

      const bubble = document.createElement("div");

      bubble.className = "bubble";

      bubble.textContent = text;

      message.appendChild(bubble);

      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;
    }


    /*
      INDICADOR DE ESCRITURA
    */

    function showTyping() {

      typing.style.display = "flex";

      chat.scrollTop = chat.scrollHeight;
    }


    function hideTyping() {

      typing.style.display = "none";
    }


    /*
      ENVIAR MENSAJE
    */

    async function sendMessage() {

      const message = messageInput.value.trim();

      if (!message) {
        return;
      }


      // Mostrar mensaje del usuario
      addMessage(message, "user");


      // Limpiar campo
      messageInput.value = "";

      messageInput.style.height = "48px";


      // Desactivar botón
      sendButton.disabled = true;


      // Mostrar escribiendo
      showTyping();


      try {

        const response = await fetch("/api/chat", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            message: message,

            history: conversationHistory

          })

        });


        const data = await response.json();


        if (!response.ok) {

          throw new Error(
            data.error || "No se pudo conectar con COIMTEC IA."
          );

        }


        const answer = data.answer || "No recibí una respuesta.";


        // Guardar conversación
        conversationHistory.push({

          role: "user",

          content: message

        });


        conversationHistory.push({

          role: "assistant",

          content: answer

        });


        // Mostrar respuesta
        addMessage(answer, "bot");


      } catch (error) {

        console.error(error);


        addMessage(

          "No pude procesar tu mensaje en este momento. Verifica la conexión con el servidor.",

          "bot"

        );

      } finally {

        hideTyping();

        sendButton.disabled = false;

        messageInput.focus();

      }

    }


    /*
      ENTER = ENVIAR
      SHIFT + ENTER = NUEVA LÍNEA
    */

    messageInput.addEventListener("keydown", function(event) {

      if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();

      }

    });


    /*
      AJUSTAR ALTURA DEL TEXTAREA
    */

    messageInput.addEventListener("input", function() {

      this.style.height = "48px";

      this.style.height =
        Math.min(this.scrollHeight, 130) + "px";

    });


  </script>

</body>
</html>
