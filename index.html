  <script>

    /*

    /*

     */

    const OPENAI_URL = "https://api.openai.com/v1/chat/completions";

    /*
     * ==========================================================

     */

    const SYSTEM_INSTRUCTION = `

    /*

    let conversationHistory = [];


    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const chat =
      document.getElementById("chat");

    const typing =
      document.getElementById("typing");


    /*
     * ==========================================================
     * MOSTRAR MENSAJE
     * ==========================================================
     */

    function addMessage(text, type) {

      const message =
        document.createElement("div");

      message.className =
        "message " + type;

      const bubble =
        document.createElement("div");

      bubble.className = "bubble";

      bubble.textContent = text;

      message.appendChild(bubble);

      chat.appendChild(message);

      chat.scrollTop =
        chat.scrollHeight;
    }


    /*
     * ==========================================================
     * INDICADOR
     * ==========================================================
     */

    function showTyping() {

      typing.style.display = "flex";

      chat.scrollTop =
        chat.scrollHeight;
    }


    function hideTyping() {

      typing.style.display = "none";
    }


    /*
     * ==========================================================
     * ENVIAR A OPENAI
     * ==========================================================
     */

    async function sendMessage() {

      const message =
        messageInput.value.trim();

      if (!message) {
        return;
      }


      if (
        !OPENAI_API_KEY ||
        OPENAI_API_KEY === "PEGA_TU_CLAVE_AQUI"
      ) {

        addMessage(
          "Falta configurar la API Key de OpenAI en el archivo index.html.",
          "bot"
        );

        return;
      }


      addMessage(
        message,
        "user"
      );


      messageInput.value = "";

      messageInput.style.height = "48px";

      sendButton.disabled = true;

      showTyping();


      try {

        const messages = [

          {
            role: "system",
            content: SYSTEM_INSTRUCTION
          },

          ...conversationHistory,

          {
            role: "user",
            content: message
          }

        ];


        const response =
          await fetch(
            OPENAI_URL,
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json",

                "Authorization":
                  "Bearer " + OPENAI_API_KEY
              },

              body: JSON.stringify({

                model: MODEL,

                messages: messages,

                temperature: 0.7

              })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          console.error(
            "OpenAI error:",
            data
          );

          throw new Error(
            data?.error?.message ||
            "Error de OpenAI"
          );
        }


        const answer =
          data?.choices?.[0]?.message?.content ||
          "No pude generar una respuesta.";


        conversationHistory.push({

          role: "user",

          content: message

        });


        conversationHistory.push({

          role: "assistant",

          content: answer

        });


        addMessage(
          answer,
          "bot"
        );


      } catch (error) {

        console.error(
          "Error:",
          error
        );


        addMessage(

          "No pude conectarme con COIMTEC IA. Revisa la API Key y la conexión con OpenAI.",

          "bot"

        );

      } finally {

        hideTyping();

        sendButton.disabled = false;

        messageInput.focus();

      }

    }


    /*
     * ==========================================================
     * ENTER PARA ENVIAR
     * ==========================================================
     */

    messageInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /*
     * ==========================================================

    messageInput.addEventListener(
      "input",
      function() {

        this.style.height = "48px";

        this.style.height =
          Math.min(
            this.scrollHeight,
            130
          ) + "px";

      }
    );
