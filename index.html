<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COIMTEC IA - Asistente Comercial</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 480px; height: 90vh; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background-color: #0b192c; color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; }
        .chat-header img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #25d366; }
        .chat-header h2 { font-size: 1.1rem; font-weight: 600; }
        .chat-header span { font-size: 0.8rem; color: #25d366; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background-color: #fcfcfc; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .message.user { background-color: #0b192c; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.assistant { background-color: #e4e6eb; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-input-area { padding: 15px; background: #ffffff; border-top: 1px solid #eaeaea; display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; outline: none; font-size: 0.95rem; }
        .chat-input-area button { background-color: #25d366; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <img src="logo.jpg" alt="CoimTec IA">
            <div>
                <h2>COIMTEC IA</h2>
                <span>● En línea</span>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                ¡Hola! Soy COIMTEC IA de TVEO Business. ¿En qué proyecto inmobiliario te gustaría que te ayude hoy?
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Escribe tu consulta aquí..." autocomplete="off">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>
    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        let chatHistory = [];
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            appendMessage(text, 'user');
            chatHistory.push({ role: 'user', content: text });
            userInput.value = '';
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: chatHistory })
                });
                const data = await res.json();
                if (res.ok && data.answer) {
                    appendMessage(data.answer, 'assistant');
                    chatHistory.push({ role: 'assistant', content: data.answer });
                } else {
                    appendMessage('Error al procesar la consulta.', 'assistant');
                }
            } catch {
                appendMessage('Error de conexión.', 'assistant');
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        function appendMessage(text, role) {
            const div = document.createElement('div');
            div.classList.add('message', role);
            div.textContent = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
