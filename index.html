<style>
* {

body {

</head>

<body>

<div class="chat-container">

    <div class="chat-header">

        <img
            src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA="
            alt="COIMTEC IA"
        >

        <div>
            <h2>COIMTEC IA</h2>
            <span>● En línea</span>
        </div>

    </div>

    <div id="chatMessages" class="chat-messages">

        <div class="message assistant">
            ¡Hola! Soy COIMTEC IA de TVEO Business.
            ¿En qué proyecto inmobiliario te gustaría que te ayude hoy?
        </div>

    </div>

    <div class="whatsapp-area">

        <a
            id="whatsappButton"
            class="whatsapp-button"
            href="https://wa.me/59177136686"
            target="_blank"
            rel="noopener noreferrer"
        >
            💬 HABLAR CON UN ASESOR
        </a>

    </div>

    <div class="chat-input-area">

        <input
            id="userInput"
            type="text"
            placeholder="Escribe tu consulta aquí..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            type="button"
        >
            Enviar
        </button>

    </div>

</div>

<script>

const API_URL = "/api/chat";
const WHATSAPP_URL = "https://wa.me/59177136686";

const chatMessages =
    document.getElementById("chatMessages");

const userInput =
    document.getElementById("userInput");

const sendButton =
    document.getElementById("sendButton");

const whatsappButton =
    document.getElementById("whatsappButton");

let chatHistory = [];

if (whatsappButton) {
    whatsappButton.href = WHATSAPP_URL;
}

function scrollChat() {

    setTimeout(function() {

        chatMessages.scrollTop =
            chatMessages.scrollHeight;

    }, 50);

}

function appendUserMessage(text) {

    const div =
        document.createElement("div");

    div.className = "message user";

    div.textContent = text;

    chatMessages.appendChild(div);

    scrollChat();

}

function limpiarRespuesta(text) {

    if (!text) {
        return "";
    }

    return text
        .replace(
            /https?:\/\/(?:www\.)?wa\.me\/[^\s<>"')\]]+/gi,
            ""
        )
        .replace(
            /https?:\/\/chat\.whatsapp\.com\/[^\s<>"')\]]+/gi,
            ""
        )
        .replace(/👉/g, "")
        .replace(/\n\s*\n\s*\n/g, "\n\n")
        .trim();

}

function mostrarBotonWhatsApp() {

    const viejo =
        document.getElementById("whatsappResponseButton");

    if (viejo) {
        viejo.remove();
    }

    const contenedor =
        document.createElement("div");

    contenedor.id =
        "whatsappResponseButton";

    contenedor.className =
        "whatsapp-response";

    const boton =
        document.createElement("a");

    boton.className =
        "whatsapp-button";

    boton.href =
        WHATSAPP_URL;

    boton.target =
        "_blank";

    boton.rel =
        "noopener noreferrer";

    boton.textContent =
        "💬 HABLAR CON UN ASESOR POR WHATSAPP";

    contenedor.appendChild(boton);

    chatMessages.appendChild(contenedor);

    scrollChat();

}

function appendAssistantMessage(text, mostrarWhatsApp) {

    const div =
        document.createElement("div");

    div.className =
        "message assistant";

    const cleanText =
        limpiarRespuesta(text);

    if (cleanText) {

        const textElement =
            document.createElement("div");

        textElement.textContent =
            cleanText;

        div.appendChild(textElement);

    }

    chatMessages.appendChild(div);

    if (mostrarWhatsApp) {
        mostrarBotonWhatsApp();
    }

    scrollChat();

}

function showLoading() {

    const div =
        document.createElement("div");

    div.className =
        "message assistant";

    div.id =
        "loadingMessage";

    div.innerHTML = `
        <div class="loading">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;

    chatMessages.appendChild(div);

    scrollChat();

}

function hideLoading() {

    const loading =
        document.getElementById("loadingMessage");

    if (loading) {
        loading.remove();
    }

}

async function sendMessage() {

    const text =
        userInput.value.trim();

    if (!text) {
        return;
    }

    sendButton.disabled = true;
    userInput.disabled = true;

    appendUserMessage(text);

    userInput.value = "";

    showLoading();

    try {

        chatHistory.push({
            role: "user",
            content: text
        });

        if (chatHistory.length > 20) {
            chatHistory =
                chatHistory.slice(-20);
        }

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: text,
                        history: chatHistory
                    })
                }
            );

        const data =
            await response.json();

        hideLoading();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "HTTP " + response.status
            );

        }

        const answer =
            data.answer ||
            "No pude generar una respuesta.";

        chatHistory.push({
            role: "assistant",
            content: answer
        });

        if (chatHistory.length > 20) {
            chatHistory =
                chatHistory.slice(-20);
        }

        appendAssistantMessage(
            answer,
            data.whatsapp === true
        );

    } catch (error) {

        console.error(
            "COIMTEC IA:",
            error
        );

        hideLoading();

        appendAssistantMessage(
            "No pude conectarme con COIMTEC IA. Por favor, intenta nuevamente.",
            false
        );

    }

    sendButton.disabled = false;
    userInput.disabled = false;

    userInput.focus();

}

sendButton.addEventListener(
    "click",
    sendMessage
);

userInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);

userInput.focus();

console.log(
    "COIMTEC IA cargado correctamente."
);

console.log(
    "WhatsApp:",
    WHATSAPP_URL
);

</script>

</body>
</html>
