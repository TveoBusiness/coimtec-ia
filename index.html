<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COIMTEC IA - Asistente Comercial</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 90vh;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* =========================
           CABECERA
        ========================== */

        .chat-header {
            background-color: #0b192c;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-header img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #25d366;
            background-color: #ffffff;
        }

        .chat-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .chat-header span {
            font-size: 0.8rem;
            color: #25d366;
        }

        /* =========================
           MENSAJES
        ========================== */

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #fcfcfc;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            background-color: #0b192c;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.assistant {
            background-color: #e4e6eb;
            color: #333333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        /* =========================
           BOTÓN WHATSAPP
        ========================== */

        .whatsapp-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            width: 100%;
            margin-top: 14px;

            padding: 13px 18px;

            background-color: #25d366;
            color: #ffffff;

            text-decoration: none;

            border-radius: 9px;

            font-size: 0.92rem;
            font-weight: 700;

            box-shadow: 0 3px 10px rgba(37, 211, 102, 0.25);

            transition:
                background-color 0.2s ease,
                transform 0.15s ease,
                box-shadow 0.2s ease;
        }

        .whatsapp-button:hover {
            background-color: #1ebe5d;
            transform: translateY(-1px);
            box-shadow: 0 5px 14px rgba(37, 211, 102, 0.35);
        }

        .whatsapp-button:active {
            transform: scale(0.98);
        }

        .whatsapp-icon {
            font-size: 1.25rem;
        }

        /* =========================
           ÁREA DE INPUT
        ========================== */

        .chat-input-area {
            padding: 15px;
            background-color: #ffffff;
            border-top: 1px solid #eaeaea;

            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;

            padding: 12px 15px;

            border: 1px solid #dddddd;
            border-radius: 8px;

            outline: none;

            font-size: 0.95rem;
        }

        .chat-input-area input:focus {
            border-color: #25d366;
        }

        .chat-input-area button {
            background-color: #25d366;
            color: #ffffff;

            border: none;

            padding: 0 20px;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;

        .chat-input-area button:hover {
            background-color: #1ebe5d;
        }

        .chat-input-area button:active {
            transform: scale(0.97);
        }

        /* =========================
           CELULAR
        ========================== */

        @media (max-width: 600px) {

            body {
                height: 100dvh;
                background-color: #ffffff;
            }

            .chat-container {
                width: 100%;
                max-width: 100%;
                height: 100dvh;

                border-radius: 0;
                box-shadow: none;
            }

            .chat-messages {
                padding: 15px;
            }

            .message {
                max-width: 90%;
            }

            .chat-input-area {
                padding: 10px;
            }

            .chat-input-area input {
                min-width: 0;
            }

            .chat-input-area button {

        }
    </style>
</head>

<body>

<div class="chat-container">

    <!-- =========================
         CABECERA
    ========================== -->

    <div class="chat-header">

        <img
            src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA="
            alt="CoimTec IA"
        >

        <div>
            <h2>COIMTEC IA</h2>
            <span>● En línea</span>
        </div>

    </div>


    <!-- =========================
         CHAT
    ========================== -->

    <div
        class="chat-messages"
        id="chatMessages"
    >

        <div class="message assistant">
            ¡Hola! Soy COIMTEC IA de TVEO Business.
            ¿En qué proyecto inmobiliario te gustaría que te ayude hoy?
        </div>

    </div>


    <!-- =========================
         INPUT
    ========================== -->

    <div class="chat-input-area">

        <input
            type="text"
            id="userInput"
            placeholder="Escribe tu consulta aquí..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            onclick="sendMessage()"
        >
            Enviar
        </button>

    </div>

</div>


<script>

    /* =========================================
       ELEMENTOS
    ========================================== */

    const chatMessages =
        document.getElementById('chatMessages');

    const userInput =
        document.getElementById('userInput');

    const sendButton =
        document.getElementById('sendButton');


    /* =========================================
       HISTORIAL
    ========================================== */

    let chatHistory = [];


    /* =========================================
       WHATSAPP OFICIAL
    ========================================== */

    const DEFAULT_WHATSAPP =
        'https://wa.me/message/PJBMLOLZEDVPF1';


    /* =========================================
       ENTER PARA ENVIAR
    ========================================== */

    userInput.addEventListener(
        'keydown',
        function(event) {

            if (event.key === 'Enter') {

                event.preventDefault();

                sendMessage();
            }

        }
    );


    /* =========================================
       ENVIAR MENSAJE
    ========================================== */

    async function sendMessage() {

        const text =
            userInput.value.trim();

        if (!text) {
            return;
        }


        /* Mostrar mensaje del usuario */
        appendMessage(
            text,
            'user'
        );


        /* Guardar historial */
        chatHistory.push({
            role: 'user',
            content: text
        });


        /* Limpiar campo */
        userInput.value = '';


        /* Desactivar temporalmente */
        setLoading(true);


        try {

            const response =
                await fetch(
                    '/api/chat',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify({
                            message: text,
                            history: chatHistory
                        })
                    }
                );


            const data =
                await response.json();


            /* =================================
               RESPUESTA CORRECTA
            ================================= */

            if (
                response.ok &&
                data.answer
            ) {

                /* Mostrar respuesta */
                appendMessage(
                    data.answer,
                    'assistant'
                );


                /* Guardar respuesta */
                chatHistory.push({
                    role: 'assistant',
                    content: data.answer
                });


                /*
                 * Si el Worker detectó que
                 * necesita asesor:
                 */

                if (
                    data.whatsapp === true
                ) {

                    appendWhatsAppButton(
                        data.whatsappUrl ||
                        DEFAULT_WHATSAPP
                    );

                }

            }

            /* =================================
               ERROR
            ================================= */

            else {

                appendMessage(
                    data.error ||
                    'Error al procesar la consulta.',
                    'assistant'
                );

            }

        }

        catch (error) {

            console.error(
                'COIMTEC IA:',
                error
            );

            appendMessage(
                'Error de conexión con COIMTEC IA. Por favor, intenta nuevamente.',
                'assistant'
            );

        }


        setLoading(false);


        /* Scroll */
        scrollChat();
    }


    /* =========================================
       MOSTRAR MENSAJE
    ========================================== */

    function appendMessage(
        text,
        role
    ) {

        const div =
            document.createElement('div');


        div.classList.add(
            'message',
            role
        );


        /*
         * RESPUESTA DEL ASISTENTE
         *
         * Buscamos cualquier enlace
         * de WhatsApp.
         */

        if (
            role === 'assistant'
        ) {

            const whatsappRegex =
                /https:\/\/wa\.me\/[^\s<]+/gi;


            const matches =
                text.match(
                    whatsappRegex
                );


            /*
             * Si encontramos enlaces
             */

            if (
                matches &&
                matches.length > 0
            ) {

                let contenido =
                    text;


                matches.forEach(
                    function(url) {

                        /*
                         * Eliminar puntuación
                         * que pueda venir pegada
                         */

                        const cleanUrl =
                            url.replace(
                                /[.,;:!?]+$/,
                                ''
                            );


                        /*
                         * Texto anterior
                         */

                        const index =
                            contenido.indexOf(
                                url
                            );


                        if (index !== -1) {

                            const antes =
                                contenido.substring(
                                    0,
                                    index
                                );


                            if (antes) {

                                div.appendChild(
                                    document.createTextNode(
                                        antes
                                    )
                                );

                            }


                            /*
                             * Crear botón
                             */

                            const button =
                                document.createElement(
                                    'a'
                                );


                            button.className =
                                'whatsapp-button';


                            button.href =
                                cleanUrl;


                            button.target =
                                '_blank';


                            button.rel =
                                'noopener noreferrer';


                            button.innerHTML = `
                                <span class="whatsapp-icon">
                                    💬
                                </span>

                                <span>
                                    HABLAR CON UN ASESOR
                                </span>
                            `;


                            div.appendChild(
                                button
                            );


                            /*
                             * Continuar después
                             * del enlace
                             */

                            contenido =
                                contenido.substring(
                                    index +
                                    url.length
                                );

                        }

                    }
                );


                /*
                 * Agregar texto restante
                 */

                if (contenido) {

                    div.appendChild(
                        document.createTextNode(
                            contenido
                        )
                    );

                }

            }

            else {

                /*
                 * Respuesta normal
                 */

                div.textContent =
                    text;

            }

        }

        else {

            /*
             * Mensaje del cliente
             */

            div.textContent =
                text;

        }


        chatMessages.appendChild(
            div
        );


        scrollChat();
    }


    /* =========================================
       BOTÓN WHATSAPP
    ========================================== */

    function appendWhatsAppButton(
        whatsappUrl
    ) {

        /*
         * Evitar duplicados.
         *
         * Si la respuesta de Gemini
         * ya tenía un enlace y lo
         * convertimos en botón,
         * no agregamos otro.
         */

        const ultimoMensaje =
            chatMessages.lastElementChild;


        if (
            ultimoMensaje &&
            ultimoMensaje.querySelector(
                '.whatsapp-button'
            )
        ) {

            return;
        }


        const wrapper =
            document.createElement('div');


        wrapper.className =
            'message assistant';


        const text =
            document.createElement(
                'div'
            );


        text.textContent =
            '¿Quieres continuar la atención directamente con un asesor de TVEO Business?';


        wrapper.appendChild(
            text
        );


        const button =
            document.createElement(
                'a'
            );


        button.className =
            'whatsapp-button';


        button.href =
            whatsappUrl;


        button.target =
            '_blank';


        button.rel =
            'noopener noreferrer';


        button.innerHTML = `
            <span class="whatsapp-icon">
                💬
            </span>

            <span>
                HABLAR CON UN ASESOR
            </span>
        `;


        wrapper.appendChild(
            button
        );


        chatMessages.appendChild(
            wrapper
        );


        scrollChat();
    }


    /* =========================================
       CARGANDO
    ========================================== */

    function setLoading(
        loading
    ) {

        sendButton.disabled =
            loading;

        userInput.disabled =
            loading;


        if (loading) {

            sendButton.textContent =
                '...';

        }

        else {

            sendButton.textContent =
                'Enviar';

            userInput.focus();

        }

    }


    /* =========================================
       SCROLL
    ========================================== */

    function scrollChat() {

        chatMessages.scrollTop =
            chatMessages.scrollHeight;
    }

</script>

</body>
</html>
