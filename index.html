==================================================

==================================================

    /* =====================================================
       ELEMENTOS DE LA INTERFAZ
       ===================================================== */

    const chatMessages = document.getElementById("chatMessages");
    const userInput = document.getElementById("userInput");
    const sendButton = document.getElementById("sendButton");


    /* =====================================================
       CREAR SESIÓN
       ===================================================== */

    function createChat() {

      if (!initializeAI()) {
        return false;
      }

      try {

        chatSession = ai.chats.create({

          model: "gemini-2.5-flash",

          config: {
            systemInstruction: systemInstruction,
            temperature: 0.7
          }

        });

        return true;

      } catch (error) {

        console.error("Error al crear la sesión Gemini:", error);

        return false;
      }
    }


    /* =====================================================
       SEGURIDAD HTML
       ===================================================== */

    function escapeHtml(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =====================================================
       MOSTRAR MENSAJE
       ===================================================== */

    function addMessage(text, type) {

      const div = document.createElement("div");

      div.className = `message ${type}`;

      div.innerHTML = escapeHtml(text)
        .replace(/\n/g, "<br>");

      chatMessages.appendChild(div);

      chatMessages.scrollTop = chatMessages.scrollHeight;

      return div;
    }


    /* =====================================================
       ENVIAR MENSAJE
       ===================================================== */

    async function sendMessage() {

      const message = userInput.value.trim();

      if (!message) {
        return;
      }


      /* Verificar API Key */

      if (!API_KEY || API_KEY === "PEGA_AQUI_TU_NUEVA_API_KEY") {

        addMessage(
          "⚠️ COIMTEC IA todavía no tiene configurada la nueva API Key de Gemini.",
          "assistant error"
        );

        return;
      }


      /* Mostrar mensaje del cliente */

      addMessage(message, "user");

      userInput.value = "";

      sendButton.disabled = true;

      userInput.disabled = true;


      /* Mostrar carga */

      const loading = addMessage(
        "COIMTEC IA está pensando...",
        "assistant loading"
      );


      try {

        /* Crear sesión si todavía no existe */

        if (!chatSession) {

          const created = createChat();

          if (!created) {
            throw new Error("No fue posible iniciar Gemini.");
          }

        }


        /* Enviar mensaje */

        const response = await chatSession.sendMessage({
          message: message
        });


        /* Eliminar mensaje de carga */

        loading.remove();


        /* Obtener respuesta */

        const answer =
          response?.text ||
          "No recibí una respuesta de Gemini. Intenta nuevamente.";


        /* Mostrar respuesta */

        addMessage(answer, "assistant");


      } catch (error) {

        console.error("ERROR GEMINI:", error);

        loading.remove();

        addMessage(
          "No pude conectarme con el servicio de IA en este momento. Revisa la configuración de Gemini e intenta nuevamente.",
          "assistant error"
        );

      } finally {

        sendButton.disabled = false;

        userInput.disabled = false;

        userInput.focus();

      }

    }


    /* =====================================================
       EVENTO BOTÓN
       ===================================================== */

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /* =====================================================
       ENTER PARA ENVIAR
       ===================================================== */

    userInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* =====================================================
       INICIO
       ===================================================== */

    userInput.focus();

  </script>
