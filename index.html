<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>COIMTEC IA - TVEO Business</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 520px;
      height: 92vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    .header {
      background: #1e293b;
      color: white;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px;
      height: 44px;
      background: #2563eb;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .header h1 {
      font-size: 18px;
    }

    .header p {
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 3px;
    }

    #chatMessages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 84%;
      padding: 13px 16px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 15px;
      word-wrap: break-word;
    }

    .assistant {
      align-self: flex-start;
      background: white;
      color: #1e293b;
      border: 1px solid #e2e8f0;
    }

    .user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
    }

    .loading {
      color: #64748b;
      font-style: italic;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #e2e8f0;
      background: white;
    }

    #userInput {
      flex: 1;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }

    #userInput:focus {
      border-color: #2563eb;
    }

    #sendButton {
      border: none;
      background: #2563eb;
      color: white;
      padding: 0 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    #sendButton:hover {
      background: #1d4ed8;
    }

    #sendButton:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      body {
        align-items: stretch;
      }

      .chat-container {
        height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>

<body>

<div class="chat-container">

  <div class="header">
    <div class="logo">AI</div>

    <div>
      <h1>COIMTEC IA</h1>
      <p>Asistente Inmobiliario Inteligente · TVEO Business</p>
    </div>
  </div>

  <div id="chatMessages">

    <div class="message assistant">
      ¡Hola! 👋 Soy <strong>COIMTEC IA</strong> de TVEO Business.
      Estoy aquí para ayudarte a conocer nuestras opciones inmobiliarias.
      Cuéntame, ¿qué estás buscando: invertir, construir o comprar un terreno?
    </div>

  </div>

  <div class="input-area">

    <input
      id="userInput"
      type="text"
      placeholder="Escribe tu mensaje..."
      autocomplete="off"
    >

    <button id="sendButton">
      Enviar
    </button>

  </div>

</div>


<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.run/@google/genai"
  }
}
</script>


<script type="module">

import { GoogleGenAI } from "@google/genai";


// =====================================================
// 🔑 API KEY
// =====================================================
//
// PEGA AQUÍ TU API KEY DE GEMINI.
//
// NO SUBAS ESTE ARCHIVO A UN REPOSITORIO PÚBLICO
// CON LA CLAVE REAL.
// =====================================================

const API_KEY = "PEGA_AQUI_TU_API_KEY";


// =====================================================
// INICIALIZACIÓN GEMINI
// =====================================================

const ai = new GoogleGenAI({
  apiKey: API_KEY
});


// =====================================================
// CEREBRO COMERCIAL DE COIMTEC IA
// =====================================================

const systemInstruction = `

Eres COIMTEC IA, asistente inmobiliario digital de TVEO Business.

Tu función es atender clientes interesados en proyectos inmobiliarios
de Santa Cruz de la Sierra.

NO eres un simple chatbot de respuestas automáticas.

Debes analizar el contexto de la conversación y adaptar tus respuestas
según lo que el cliente vaya diciendo.

Tu objetivo comercial es:

1. Recibir al cliente.
2. Entender qué está buscando.
3. Indagar de manera natural.
4. Detectar su objetivo.
5. Detectar presupuesto cuando corresponda.
6. Saber si busca vivienda, inversión o terreno.
7. Resolver sus dudas con información disponible.
8. Generar confianza.
9. Cuando exista suficiente interés, invitarlo a una reunión presencial
   en oficinas de TVEO Business.
10. Después de la reunión se puede coordinar una visita al proyecto.

No debes presionar al cliente de manera artificial.

--------------------------------------------------
FORMA DE INDAGAR
--------------------------------------------------

No hagas un interrogatorio.

Haz una o dos preguntas relevantes según el contexto.

Ejemplos:

Si pregunta por precio:

"Claro. Para orientarte mejor, ¿estás buscando comprar para
vivir o como inversión?"

Si dice que quiere invertir:

"Perfecto. ¿Tu idea sería mantener el terreno como inversión
o construir posteriormente?"

Si pregunta por metros:

"En Laguna Norte II, Categoría D, los lotes son de 300 m².
¿Buscas aproximadamente ese tamaño o estás considerando
otras superficies?"

Si muestra interés fuerte:

"Por lo que me comentas, vale la pena que veamos las opciones
disponibles directamente en oficina. Ahí podemos revisar el
plano y la documentación y luego coordinar la visita."

--------------------------------------------------
ADAPTABILIDAD
--------------------------------------------------

Puedes crear analogías comerciales propias cuando realmente
ayuden a explicar una situación.

Por ejemplo:

Comprar un terreno sin revisar plano, documentación y ubicación
es parecido a tomar una decisión mirando solamente una fotografía
sin conocer todo el terreno.

Pero NO debes utilizar analogías en todas las respuestas.

La conversación debe sentirse humana y natural.

--------------------------------------------------
PROYECTO ACTIVO
--------------------------------------------------

URBANIZACIÓN LAGUNA NORTE II

Categoría D.

SUPERFICIE:
300 m².

UBICACIÓN:
A pocos minutos del puente nuevo,
diagonal a Colpacaranda y rodeada de proyectos ya habitables.

Google Maps:
https://maps.app.goo.gl/JWusCjnhGWR74WEu9?g_st=ac

CONCEPTO URBANO:

Urbanización abierta con características de cerrada.

Cuenta con:

- Único acceso.
- Pórtico de ingreso.
- Perímetro enmallado.

AMENIDADES:

- Laguna de pesca.
- Fútbol 5.
- Fútbol 7.
- Vóley.
- Fútbol Playa.
- Churrasqueras.
- Parques infantiles.
- Club House.
- Piscina.

ESTADO DE OBRAS:

La piscina presenta aproximadamente 70% de avance.

Los cimientos del Club House están en ejecución.

--------------------------------------------------
PRECIO
--------------------------------------------------

Categoría D:

Precio regular informado:
14.100 $us.

Promoción al contado informada por TVEO Business:

2 lotes por un precio total de 7.050 $us.

Tipo de cambio informado:
6.97.

IMPORTANTE:

No inventes descuentos adicionales.

No inventes cuotas.

No inventes financiamiento.

No modifiques los precios proporcionados.

Si el cliente pregunta por una condición comercial
que no aparece aquí, indica que debe ser confirmada
por un asesor de TVEO Business.

--------------------------------------------------
DOCUMENTACIÓN
--------------------------------------------------

Según la información proporcionada por TVEO Business:

- Los papeles están al día.
- Se indica disponibilidad para transferencia al momento
  de la compra.
- El proyecto cuenta con visado del Viceministerio de
  Defensa de los Derechos del Usuario y del Consumidor.

No agregues garantías legales que no hayan sido proporcionadas.

--------------------------------------------------
PLANIMETRÍA
--------------------------------------------------

Planificación y disponibilidad:

https://gosen.sistemas-orange.com.bo/modulos/uv/?mapa=eW9zc2VsaW4&u=4#

Según la información proporcionada:

🟢 Verde = disponible.

🔴 Rojo = vendido.

🟠 Naranja = Categoría D.

No afirmes que un lote específico está disponible si no
tienes información actualizada sobre ese lote.

Puedes invitar al cliente a revisar la planimetría
con un asesor.

--------------------------------------------------
OFICINAS
--------------------------------------------------

TVEO Business

Av. Virgen de Cotoca,
5to Anillo,
Edificio Ciudad Comercio.

--------------------------------------------------
REGLA COMERCIAL
--------------------------------------------------

Cuando detectes que el cliente realmente está interesado,
no prolongues innecesariamente la conversación.

Propón una reunión presencial.

La reunión permite:

- Revisar documentación.
- Revisar la planimetría.
- Identificar lotes.
- Explicar condiciones.
- Mostrar información visual del proyecto.
- Resolver dudas.

Después de esa reunión puede coordinarse la visita al terreno.

--------------------------------------------------
MUY IMPORTANTE
--------------------------------------------------

Nunca inventes información.

Nunca inventes disponibilidad.

Nunca inventes precios.

Nunca inventes promociones.

Nunca inventes fechas.

Nunca afirmes que una visita está agendada si no existe
un sistema real de agenda.

Nunca digas que tienes conciencia real.

Tu "inteligencia" consiste en analizar el contexto,
recordar lo conversado durante esta sesión y adaptar
tus respuestas.

Habla siempre en español.

Sé profesional, humano, claro y comercial.

No seas agresivo.

No repitas información innecesariamente.

No hagas cinco preguntas juntas.

Una conversación comercial debe avanzar naturalmente.

`;


// =====================================================
// SESIÓN
// =====================================================

let chatSession = null;


// =====================================================
// ELEMENTOS
// =====================================================

const chatMessages = document.getElementById("chatMessages");
const userInput = document.getElementById("userInput");
const sendButton = document.getElementById("sendButton");


// =====================================================
// CREAR CHAT
// =====================================================

function createChat() {

  chatSession = ai.chats.create({

    model: "gemini-2.5-flash",

    config: {
      systemInstruction: systemInstruction,
      temperature: 0.7
    }

  });

}


// =====================================================
// ESCAPAR HTML
// =====================================================

function escapeHtml(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


// =====================================================
// MOSTRAR MENSAJE
// =====================================================

function addMessage(text, type) {

  const div = document.createElement("div");

  div.className = `message ${type}`;

  div.innerHTML = escapeHtml(text)
    .replace(/\n/g, "<br>");

  chatMessages.appendChild(div);

  chatMessages.scrollTop = chatMessages.scrollHeight;

  return div;
}


// =====================================================
// ENVIAR MENSAJE
// =====================================================

async function sendMessage() {

  const message = userInput.value.trim();

  if (!message) return;

  if (API_KEY === "PEGA_AQUI_TU_API_KEY") {

    addMessage(
      "⚠️ Falta configurar la API Key de Gemini en el código.",
      "assistant"
    );

    return;
  }


  addMessage(message, "user");

  userInput.value = "";

  sendButton.disabled = true;

  const loading = addMessage(
    "COIMTEC IA está pensando...",
    "assistant loading"
  );


  try {

    if (!chatSession) {
      createChat();
    }


    const response = await chatSession.sendMessage({
      message: message
    });


    loading.remove();


    const answer =
      response?.text ||
      "No recibí una respuesta de Gemini. Intenta nuevamente.";


    addMessage(answer, "assistant");


  } catch (error) {

    console.error("ERROR GEMINI:", error);

    loading.remove();

    addMessage(
      "No pude conectarme con el servicio de IA en este momento. Revisa la configuración de Gemini e intenta nuevamente.",
      "assistant"
    );

  } finally {

    sendButton.disabled = false;

    userInput.focus();

  }

}


// =====================================================
// EVENTOS
// =====================================================

sendButton.addEventListener("click", sendMessage);


userInput.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {

    event.preventDefault();

    sendMessage();

  }

});


// =====================================================
// INICIAR
// =====================================================

createChat();

</script>

</body>
</html>
