<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>COIMTEC IA - TVEO Business</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 520px;
      height: 92vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    }

    .header {
      background: #1e293b;
      color: white;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px;
      height: 44px;
      background: #2563eb;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 18px;
    }

    .header p {
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 3px;
    }

    #chatMessages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 84%;
      padding: 13px 16px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 15px;
      word-wrap: break-word;
    }

    .assistant {
      align-self: flex-start;
      background: #ffffff;
      color: #1e293b;
      border: 1px solid #e2e8f0;
    }

    .user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
    }

    .loading {
      color: #64748b;
      font-style: italic;
    }

    .error {
      color: #b91c1c;
      background: #fef2f2;
      border-color: #fecaca;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #e2e8f0;
      background: white;
    }

    #userInput {
      flex: 1;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }

    #userInput:focus {
      border-color: #2563eb;
    }

    #sendButton {
      border: none;
      background: #2563eb;
      color: white;
      padding: 0 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    #sendButton:hover {
      background: #1d4ed8;
    }

    #sendButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      body {
        align-items: stretch;
      }

      .chat-container {
        height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="header">
      <div class="logo">AI</div>

      <div>
        <h1>COIMTEC IA</h1>
        <p>Asistente Inteligente · TVEO Business</p>
      </div>
    </div>

    <div id="chatMessages">

      <div class="message assistant">
        ¡Hola! 👋 Soy <strong>COIMTEC IA</strong> de TVEO Business.
        <br><br>
        Estoy aquí para ayudarte con información sobre nuestros proyectos inmobiliarios.
        <br><br>
        Cuéntame, ¿estás buscando invertir, comprar un terreno o construir?
      </div>

    </div>

    <div class="input-area">

      <input
        id="userInput"
        type="text"
        placeholder="Escribe tu mensaje..."
        autocomplete="off"
      >

      <button id="sendButton">
        Enviar
      </button>

    </div>

  </div>

  <script>

    /*
    ============================================================
    COIMTEC IA
    ============================================================

    Este frontend NO contiene ninguna API KEY.

    La comunicación se realiza mediante:

    index.html
          ↓
       /api/chat
          ↓
       OpenAI

    La clave de OpenAI permanece en el servidor.
    ============================================================
    */

    const chatMessages = document.getElementById("chatMessages");
    const userInput = document.getElementById("userInput");
    const sendButton = document.getElementById("sendButton");

    // Historial de la conversación actual
    const conversationHistory = [];


    /*
    ============================================================
    SEGURIDAD HTML
    ============================================================
    */

    function escapeHtml(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
    ============================================================
    MOSTRAR MENSAJE
    ============================================================
    */

    function addMessage(text, type) {

      const div = document.createElement("div");

      div.className = `message ${type}`;

      div.innerHTML = escapeHtml(text)
        .replace(/\n/g, "<br>");

      chatMessages.appendChild(div);

      chatMessages.scrollTop = chatMessages.scrollHeight;

      return div;

    }


    /*
    ============================================================
    ENVIAR MENSAJE A COIMTEC
    ============================================================
    */

    async function sendMessage() {

      const message = userInput.value.trim();

      if (!message) {
        return;
      }

      // Mostrar mensaje del cliente
      addMessage(message, "user");

      // Limpiar campo
      userInput.value = "";

      // Desactivar controles
      sendButton.disabled = true;
      userInput.disabled = true;

      // Mostrar carga
      const loading = addMessage(
        "COIMTEC IA está pensando...",
        "assistant loading"
      );


      try {

        /*
        --------------------------------------------------------
        Enviar mensaje al backend
        --------------------------------------------------------
        */

        const response = await fetch("/api/chat", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            message: message,

            history: conversationHistory

          })

        });


        const data = await response.json();


        if (!response.ok) {

          throw new Error(
            data?.error || "Error del servidor"
          );

        }


        // Eliminar mensaje de carga
        loading.remove();


        /*
        --------------------------------------------------------
        Obtener respuesta de COIMTEC
        --------------------------------------------------------
        */

        const answer =
          data?.answer ||
          "No recibí una respuesta. Intenta nuevamente.";


        // Mostrar respuesta
        addMessage(answer, "assistant");


        /*
        --------------------------------------------------------
        Guardar conversación
        --------------------------------------------------------
        */

        conversationHistory.push({

          role: "user",

          content: message

        });


        conversationHistory.push({

          role: "assistant",

          content: answer

        });


      } catch (error) {

        console.error("Error COIMTEC:", error);

        loading.remove();

        addMessage(
          "No pude conectarme con COIMTEC en este momento. Intenta nuevamente.",
          "assistant error"
        );

      } finally {

        sendButton.disabled = false;

        userInput.disabled = false;

        userInput.focus();

      }

    }


    /*
    ============================================================
    BOTÓN ENVIAR
    ============================================================
    */

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /*
    ============================================================
    ENTER PARA ENVIAR
    ============================================================
    */

    userInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /*
    ============================================================
    INICIO
    ============================================================
    */

    userInput.focus();

  </script>

</body>
</html>
