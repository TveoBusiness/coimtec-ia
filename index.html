<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COIMTEC IA</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        .chat-box { height: 400px; border: 1px solid #ddd; border-radius: 4px; padding: 10px; overflow-y: scroll; margin-bottom: 10px; background: #fafafa; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 6px; max-width: 80%; word-break: break-word; }
        .user { background: #dcf8c6; margin-left: auto; text-align: right; }
        .bot { background: #e2e2e2; margin-right: auto; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>COIMTEC IA</h2>
    <div class="chat-box" id="chatBox">
        <div class="message bot">¡Hola! Soy COIMTEC IA. ¿En qué te puedo ayudar hoy?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Escribe tu mensaje...">
        <button id="sendBtn">Enviar</button>
    </div>
</div>

<script type="module">
    import { GoogleGenAI } from "https://esm.run/@google/genai";

    // Pega aquí tu clave real que empieza por AIzaSy...
    const ai = new GoogleGenAI({ apiKey: "AQ.Ab8RN6LkiwAeqfk0RqDM03JDB6tXhVM9v3nZVxJlI-DiQjFrRg" });

    function appendMessage(text, sender) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function handleSendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        input.value = '';

        const sendBtn = document.getElementById('sendBtn');
        sendBtn.disabled = true;

        try {
            const response = await ai.models.generateContent({
                model: 'gemini-3.6-flash', // Actualizado al modelo actual recomendado
                contents: text,
                config: {
                    systemInstruction: "Eres COIMTEC IA, un asistente de inteligencia artificial profesional, eficiente y servicial para operaciones comerciales e inmobiliarias."
                }
            });

            const botReply = response.text || "No recibí respuesta del modelo.";
            appendMessage(botReply, 'bot');
        } catch (error) {
            console.error(error);
            appendMessage("Error al conectar con Gemini. Revisa la consola.", 'bot');
        } finally {
            sendBtn.disabled = false;
        }
    }

    document.getElementById('sendBtn').addEventListener('click', handleSendMessage);
    document.getElementById('userInput').addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            handleSendMessage();
        }
    });
</script>

</body>
</html>
